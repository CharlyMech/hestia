name: CI

on:
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env is required by Env.load(); the analyzer/tests don't need real keys.
      - name: Stub .env
        run: cp .env.example .env || touch .env

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "No tests yet - skipping"; fi
