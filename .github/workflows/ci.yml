name: CI

on:
  pull_request:
    branches: [main]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Dart configuration
        run: cp lib/core/config/env.example.dart lib/core/config/env.dart

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: |
          if [ -d test ]; then flutter test; else echo "No tests yet - skipping"; fi
